<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
  <meta name="theme-color" content="#050817">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nebula Strike">
  <title>Nebula Strike — Pinball Arcade</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <style>
    :root{--bg:#030611;--panel:#071128;--cyan:#18ddff;--pink:#ff43d4;--amber:#ffc857;--text:#eaf9ff;--muted:#81a4ba}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;touch-action:none;user-select:none;-webkit-user-select:none}
    body{display:grid;place-items:center;background:radial-gradient(circle at 50% -10%,#132a6a 0,#050817 46%,#02040b 100%)}
    button{font:inherit;color:inherit}
    #app{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto;width:min(100vw,560px);height:100dvh;overflow:hidden;background:#050817;border-inline:1px solid #1d3f66;box-shadow:0 0 80px #0bc9ff20}
    .hud{z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 12px 8px;background:linear-gradient(#081128f5,#050a18f0);border-bottom:1px solid #28547a;box-shadow:0 6px 18px #000b}
    .brand{text-align:center;line-height:.8;font-weight:1000;font-style:italic;letter-spacing:.06em;text-shadow:0 0 10px var(--cyan)}
    .brand b{display:block;color:var(--cyan);font-size:clamp(14px,4vw,22px)}.brand i{display:block;color:var(--pink);font-size:clamp(12px,3.3vw,18px)}
    .readout{min-width:0}.readout.right{text-align:right}.label{display:block;color:var(--amber);font-size:9px;letter-spacing:.14em}.digits{display:block;color:#ffd777;font-weight:900;font-size:clamp(15px,4.5vw,25px);letter-spacing:.05em;text-shadow:0 0 9px #ff9f1c}
    .mini{color:var(--muted);font-size:9px;margin-top:2px;white-space:nowrap}.balls{color:var(--cyan);letter-spacing:2px}
    #stage{position:relative;min-height:0;background:#02040b;overflow:hidden}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    #message{position:absolute;z-index:2;left:50%;top:48%;transform:translate(-50%,-50%);width:min(82%,360px);padding:14px 18px;text-align:center;border:1px solid #38ddff88;background:#03091bd9;box-shadow:0 0 30px #13d8ff33,inset 0 0 20px #132c55;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .2s}
    #message.show{opacity:1}.message-title{font-weight:1000;color:var(--amber);font-size:clamp(18px,5vw,28px);letter-spacing:.09em}.message-sub{margin-top:6px;color:#b9eaff;font-size:12px;line-height:1.45}
    .controls{z-index:4;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#071128,#030711);border-top:1px solid #29506d;box-shadow:0 -8px 22px #000c}
    .flipper-btn,.launch-btn,.icon-btn{position:relative;border:1px solid currentColor;background:linear-gradient(160deg,#0c2443,#050a18);box-shadow:inset 0 0 18px #142e50,0 0 12px currentColor;cursor:pointer;touch-action:none}
    .flipper-btn{height:clamp(58px,11vh,82px);border-radius:50%;font-weight:900;font-size:clamp(12px,3.3vw,17px);letter-spacing:.08em}.flipper-btn.left{color:var(--cyan)}.flipper-btn.right{color:var(--pink)}
    .flipper-btn.active{transform:translateY(2px) scale(.97);background:#143858;filter:brightness(1.45)}
    .center-controls{display:grid;grid-template-columns:34px clamp(62px,17vw,86px) 34px;gap:7px;align-items:center}.launch-btn{aspect-ratio:1;border-radius:50%;color:var(--amber);font-size:11px;font-weight:1000}.launch-btn:active{transform:scale(.95);filter:brightness(1.4)}.icon-btn{width:34px;height:34px;border-radius:50%;color:#aeefff;padding:0;font-size:16px}
    dialog{color:var(--text);width:min(90vw,430px);border:1px solid #2acff0;background:#071128f8;border-radius:14px;box-shadow:0 0 60px #0ad9ff35;padding:0}dialog::backdrop{background:#000b;backdrop-filter:blur(5px)}
    .settings{padding:22px}.settings h2{margin:0 0 18px;color:var(--cyan);font-size:20px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0;border-top:1px solid #173654}.setting-row span small{display:block;color:var(--muted);margin-top:4px;font-size:10px}.choice{display:flex;background:#020713;border:1px solid #29506d;border-radius:8px;padding:2px}.choice button{border:0;background:transparent;padding:8px 10px;border-radius:6px;font-size:11px}.choice button.selected{background:#174365;color:#fff;box-shadow:0 0 10px #13d8ff55}.close{width:100%;margin-top:18px;padding:11px;border:1px solid var(--amber);border-radius:8px;background:#312309;color:#ffdc88;font-weight:900}
    .rotate{display:none;position:fixed;inset:0;z-index:20;background:#030611;place-items:center;text-align:center;padding:30px;color:var(--cyan)}
    @media (orientation:landscape) and (max-height:560px) and (pointer:coarse){.rotate{display:grid}}
    @media (min-width:700px){#app{height:min(100dvh,980px);border-radius:18px}.hud{padding-top:10px}.controls{padding-bottom:12px}}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main id="app" aria-label="Nebula Strike ピンボール">
    <header class="hud">
      <div class="readout"><span class="label">SCORE</span><strong id="score" class="digits">0000000</strong><div class="mini">× <span id="multiplier">1</span></div></div>
      <div class="brand"><b>NEBULA</b><i>STRIKE</i></div>
      <div class="readout right"><span class="label">HIGH</span><strong id="high" class="digits">0000000</strong><div class="mini">BALLS <span id="balls" class="balls">●●●</span></div></div>
    </header>
    <section id="stage" aria-label="ピンボール盤面">
      <canvas id="game" width="600" height="960"></canvas>
      <div id="message"><div class="message-title"></div><div class="message-sub"></div></div>
    </section>
    <footer class="controls" id="controls">
      <button class="flipper-btn left" id="leftBtn" aria-label="左フリッパー">LEFT</button>
      <div class="center-controls"><button class="icon-btn" id="soundBtn" aria-label="サウンド切替">♪</button><button class="launch-btn" id="launchBtn">LAUNCH</button><button class="icon-btn" id="settingsBtn" aria-label="設定">⚙</button></div>
      <button class="flipper-btn right" id="rightBtn" aria-label="右フリッパー">RIGHT</button>
    </footer>
  </main>
  <div class="rotate">端末を縦向きにするとプレイできます</div>
  <dialog id="settingsDialog">
    <div class="settings"><h2>GAME SETTINGS</h2>
      <div class="setting-row"><span>タッチ操作<small>片手モードは左右同時に作動</small></span><div class="choice"><button data-mode="one">片手</button><button data-mode="split">左右</button></div></div>
      <div class="setting-row"><span>効果音<small>Web Audioによるオリジナル音源</small></span><div class="choice"><button data-sound="on">ON</button><button data-sound="off">OFF</button></div></div>
      <button class="close" id="closeSettings">プレイに戻る</button>
    </div>
  </dialog>
  <script>
  (()=>{'use strict';
    const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d',{alpha:false});
    const ui={score:document.querySelector('#score'),high:document.querySelector('#high'),balls:document.querySelector('#balls'),multiplier:document.querySelector('#multiplier'),message:document.querySelector('#message'),left:document.querySelector('#leftBtn'),right:document.querySelector('#rightBtn'),launch:document.querySelector('#launchBtn'),sound:document.querySelector('#soundBtn'),settings:document.querySelector('#settingsDialog')};
    const W=600,H=960,STEP=1/120,MAX_FRAME=.05,TAU=Math.PI*2;
    const storage={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
    const prefs={mode:storage.get('nebula-mode','one'),sound:storage.get('nebula-sound',true)};
    let high=storage.get('nebula-high',0),score=0,balls=3,multiplier=1,state='ready',last=performance.now(),acc=0,shake=0,flash=0,idle=0,launchPower=0;
    const input={left:false,right:false};
    const ball={x:542,y:820,vx:0,vy:0,r:11,active:false,trail:[]};
    const stars=Array.from({length:85},(_,i)=>({x:(i*137.5)%W,y:(i*83.7)%H,r:.5+(i%3)*.45,a:.22+(i%5)*.1}));
    const bumpers=[{x:215,y:265,r:48,c:'#19dfff',v:350},{x:388,y:270,r:48,c:'#19dfff',v:350},{x:303,y:390,r:52,c:'#ff43d4',v:500}];
    const posts=[{x:115,y:548,r:18},{x:486,y:548,r:18},{x:176,y:650,r:13},{x:424,y:650,r:13},{x:300,y:538,r:19}];
    const targets=[{x:250,y:486,w:28,h:50,hit:0},{x:286,y:486,w:28,h:50,hit:0},{x:322,y:486,w:28,h:50,hit:0}];
    const flippers=[{side:'left',px:205,py:812,len:116,r:14,rest:.42,up:-.38,a:.42,omega:0},{side:'right',px:395,py:812,len:116,r:14,rest:Math.PI-.42,up:Math.PI+.38,a:Math.PI-.42,omega:0}];
    const walls=[
      [52,830,42,190],[42,190,95,105],[95,105,470,105],[470,105,552,188],[552,188,552,855],
      [52,830,150,900],[150,900,252,900],[348,900,450,900],[450,900,552,830],
      [92,520,132,725],[132,725,170,770],[508,520,468,725],[468,725,430,770],
      [118,140,90,260],[90,260,78,420],[482,140,510,255],[510,255,520,420]
    ];
    const audio={ctx:null,enabled:true,init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume()},tone(f=280,d=.07,type='sine',vol=.04,slide=0){if(!prefs.sound)return;this.init();const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(this.ctx.destination);o.start(t);o.stop(t+d)}};
    function updateHUD(){ui.score.textContent=String(score).padStart(7,'0');ui.high.textContent=String(high).padStart(7,'0');ui.balls.textContent='●'.repeat(balls)+'○'.repeat(3-balls);ui.multiplier.textContent=multiplier;ui.sound.textContent=prefs.sound?'♪':'×';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('selected',b.dataset.mode===prefs.mode));document.querySelectorAll('[data-sound]').forEach(b=>b.classList.toggle('selected',(b.dataset.sound==='on')===prefs.sound))}
    function message(title,sub='',ms=0){ui.message.querySelector('.message-title').textContent=title;ui.message.querySelector('.message-sub').textContent=sub;ui.message.classList.add('show');if(ms)setTimeout(()=>ui.message.classList.remove('show'),ms)}
    function addScore(n){score+=n*multiplier;if(score>high){high=score;storage.set('nebula-high',high)}updateHUD()}
    function resetBall(){ball.x=542;ball.y=820;ball.vx=0;ball.vy=0;ball.active=false;ball.trail.length=0;idle=0;state='ready';message(balls===3&&score===0?'READY':'BALL '+(4-balls),'SPACE / LAUNCH で発射',1400)}
    function newGame(){score=0;balls=3;multiplier=1;targets.forEach(t=>t.hit=0);resetBall();updateHUD()}
    function launch(){audio.init();if(state==='gameover'){newGame();return}if(!ball.active){ball.active=true;state='playing';ball.vx=-25;ball.vy=-980-launchPower;launchPower=0;ui.message.classList.remove('show');audio.tone(130,.2,'sawtooth',.045,500)}}
    function loseBall(){if(state!=='playing')return;ball.active=false;balls--;audio.tone(180,.5,'sawtooth',.05,-120);updateHUD();if(balls<=0){state='gameover';message('GAME OVER','SCORE '+score.toLocaleString()+' — LAUNCHでリスタート');storage.set('nebula-high',high)}else{setTimeout(resetBall,700)}}
    function closestPoint(ax,ay,bx,by,px,py){const dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1)));return{x:ax+dx*t,y:ay+dy*t,t}}
    function collideSegment(ax,ay,bx,by,restitution=.82,kick=0){const q=closestPoint(ax,ay,bx,by,ball.x,ball.y),dx=ball.x-q.x,dy=ball.y-q.y,d=Math.hypot(dx,dy),min=ball.r+3;if(d>=min||d===0)return false;const nx=dx/d,ny=dy/d,rel=ball.vx*nx+ball.vy*ny;if(rel<30){ball.x+=nx*(min-d+.3);ball.y+=ny*(min-d+.3);ball.vx-=nx*(1+restitution)*rel;ball.vy-=ny*(1+restitution)*rel;if(kick){ball.vx+=nx*kick;ball.vy+=ny*kick}return true}return false}
    function collideCircle(o,bonus=0){const dx=ball.x-o.x,dy=ball.y-o.y,d=Math.hypot(dx,dy),min=ball.r+o.r;if(d>=min||d===0)return false;const nx=dx/d,ny=dy/d,rel=ball.vx*nx+ball.vy*ny;ball.x+=nx*(min-d+.5);ball.y+=ny*(min-d+.5);if(rel<0){ball.vx-=nx*1.88*rel;ball.vy-=ny*1.88*rel;if(o.v){ball.vx+=nx*o.v;ball.vy+=ny*o.v;addScore(bonus);flash=.18;shake=5;audio.tone(o.c==='#ff43d4'?520:690,.09,'square',.025,180)}}return true}
    function flipperPhysics(f,pressed,dt){const target=pressed?f.up:f.rest,prev=f.a,diff=target-f.a;f.a+=diff*Math.min(1,dt*(pressed?34:19));f.omega=(f.a-prev)/dt;const dir=f.side==='left'?1:-1,ex=f.px+Math.cos(f.a)*f.len*dir,ey=f.py+Math.sin(f.a)*f.len*dir,q=closestPoint(f.px,f.py,ex,ey,ball.x,ball.y),dx=ball.x-q.x,dy=ball.y-q.y,d=Math.hypot(dx,dy),min=ball.r+f.r;if(ball.active&&d<min&&d>0){const nx=dx/d,ny=dy/d,rx=q.x-f.px,ry=q.y-f.py,sx=-f.omega*ry,sy=f.omega*rx,rv=(ball.vx-sx)*nx+(ball.vy-sy)*ny;ball.x+=nx*(min-d+.7);ball.y+=ny*(min-d+.7);if(rv<70){ball.vx-=nx*(1.75*rv);ball.vy-=ny*(1.75*rv);if(pressed&&Math.abs(f.omega)>.25){ball.vx+=sx*.72;ball.vy+=sy*.72-120}audio.tone(180,.045,'square',.025,80)}}}
    function physics(dt){flippers.forEach(f=>flipperPhysics(f,input[f.side],dt));if(!ball.active)return;for(let sub=0;sub<2;sub++){const sdt=dt/2;ball.vy+=455*sdt;ball.vx*=.9997;ball.vy*=.9997;ball.x+=ball.vx*sdt;ball.y+=ball.vy*sdt;walls.forEach(w=>collideSegment(...w,.78));bumpers.forEach(b=>collideCircle(b,100));posts.forEach(p=>collideCircle(p,25));targets.forEach(t=>{if(ball.x+ball.r>t.x&&ball.x-ball.r<t.x+t.w&&ball.y+ball.r>t.y&&ball.y-ball.r<t.y+t.h){const side=Math.min(Math.abs(ball.x-t.x),Math.abs(ball.x-(t.x+t.w)))<Math.min(Math.abs(ball.y-t.y),Math.abs(ball.y-(t.y+t.h)));if(side)ball.vx*=-.85;else ball.vy*=-.85;ball.y-=2;t.hit=1;addScore(250);audio.tone(820,.06,'square',.02,160);if(targets.every(x=>x.hit)){targets.forEach(x=>x.hit=0);multiplier=Math.min(10,multiplier+1);addScore(1000)}}});if(ball.x>516&&ball.y>710){ball.x=Math.min(ball.x,542-ball.r);if(ball.vx>0)ball.vx*=-.7}if(ball.x<0||ball.x>W||ball.y<-60){ball.x=Math.max(20,Math.min(W-20,ball.x));ball.vx*=-.7}if(ball.y>H+45){loseBall();break}}
      const speed=Math.hypot(ball.vx,ball.vy);if(speed>1450){ball.vx*=1450/speed;ball.vy*=1450/speed}if(speed<36&&ball.y<865)idle+=dt;else idle=0;if(idle>3){ball.vx+=(W/2-ball.x)*.8;ball.vy=-520;idle=0;message('GRAVITY PULSE','ボールを救済しました',900);audio.tone(260,.25,'sine',.035,500)}ball.trail.unshift({x:ball.x,y:ball.y});if(ball.trail.length>9)ball.trail.pop();flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt*20)}
    function pathRoundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
    function line(ax,ay,bx,by,w=6,c='#93c8e8'){ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.lineWidth=w;ctx.strokeStyle=c;ctx.stroke()}
    function glowCircle(x,y,r,c){ctx.save();ctx.shadowColor=c;ctx.shadowBlur=22;const g=ctx.createRadialGradient(x-r*.25,y-r*.3,2,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(.15,c);g.addColorStop(.6,'#15325f');g.addColorStop(1,'#050817');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#b8d6e8';ctx.stroke();ctx.restore()}
    function render(){ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#071842');bg.addColorStop(.52,'#08082b');bg.addColorStop(1,'#030713');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);stars.forEach(s=>{ctx.globalAlpha=s.a;ctx.fillStyle=s.r>1?'#68e8ff':'#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill()});ctx.globalAlpha=1;
      const neb=ctx.createRadialGradient(305,520,20,305,520,310);neb.addColorStop(0,'#ff28c329');neb.addColorStop(.35,'#5526c51d');neb.addColorStop(1,'transparent');ctx.fillStyle=neb;ctx.fillRect(0,130,W,680);
      ctx.lineCap='round';walls.forEach(w=>{line(...w,13,'#091b35');line(...w,7,'#92bad1');line(...w,2,'#effcff')});
      ctx.save();ctx.shadowColor='#13d8ff';ctx.shadowBlur=20;line(535,180,535,740,12,'#06466d');line(535,180,535,740,3,'#22eaff');ctx.restore();
      ctx.fillStyle='#ffc857';ctx.font='900 20px ui-monospace';ctx.textAlign='center';ctx.fillText('ORBITAL RELAY',300,157);
      bumpers.forEach(b=>{glowCircle(b.x,b.y,b.r,b.c);ctx.fillStyle='#fff';ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(b.x-12,b.y-14,9,0,TAU);ctx.fill();ctx.globalAlpha=1});
      targets.forEach((t,i)=>{ctx.save();ctx.shadowColor=t.hit?'#ffc857':'#ff3ed1';ctx.shadowBlur=t.hit?20:8;pathRoundRect(t.x,t.y,t.w,t.h,5);ctx.fillStyle=t.hit?'#ffc857':'#5c174f';ctx.fill();ctx.strokeStyle='#ffd9f6';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 18px sans-serif';ctx.textAlign='center';ctx.fillText('★',t.x+t.w/2,t.y+32);ctx.restore()});
      posts.forEach(p=>glowCircle(p.x,p.y,p.r,'#ffc857'));
      for(let i=0;i<6;i++){const x=105+i*78,y=690+Math.sin(i)*18;ctx.fillStyle=i%2?'#ff43d4':'#13d8ff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(x,y-12);ctx.lineTo(x+12,y+11);ctx.lineTo(x-12,y+11);ctx.closePath();ctx.fill()}ctx.shadowBlur=0;
      flippers.forEach(f=>{const dir=f.side==='left'?1:-1,ex=f.px+Math.cos(f.a)*f.len*dir,ey=f.py+Math.sin(f.a)*f.len*dir;ctx.save();ctx.lineCap='round';ctx.shadowColor=f.side==='left'?'#13d8ff':'#ff43d4';ctx.shadowBlur=16;line(f.px,f.py,ex,ey,30,'#17253d');line(f.px,f.py,ex,ey,22,'#c9d7e1');line(f.px,f.py,ex,ey,7,f.side==='left'?'#13d8ff':'#ff43d4');ctx.restore()});
      ball.trail.forEach((p,i)=>{ctx.globalAlpha=(ball.trail.length-i)/ball.trail.length*.18;ctx.fillStyle='#8ff4ff';ctx.beginPath();ctx.arc(p.x,p.y,ball.r*(1-i/13),0,TAU);ctx.fill()});ctx.globalAlpha=1;
      if(ball.active||state==='ready'){const g=ctx.createRadialGradient(ball.x-4,ball.y-5,1,ball.x,ball.y,ball.r);g.addColorStop(0,'#fff');g.addColorStop(.28,'#d9f4ff');g.addColorStop(.6,'#607080');g.addColorStop(1,'#10151d');ctx.shadowColor='#fff';ctx.shadowBlur=10;ctx.fillStyle=g;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,TAU);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();ctx.shadowBlur=0}
      if(flash){ctx.fillStyle=`rgba(80,235,255,${flash*.35})`;ctx.fillRect(0,0,W,H)}ctx.restore()}
    function loop(now){const delta=Math.min(MAX_FRAME,(now-last)/1000);last=now;acc+=delta;while(acc>=STEP){physics(STEP);acc-=STEP}render();requestAnimationFrame(loop)}
    function setFlipper(side,on){if(prefs.mode==='one'){input.left=on;input.right=on;ui.left.classList.toggle('active',on);ui.right.classList.toggle('active',on)}else{input[side]=on;ui[side].classList.toggle('active',on)}if(on){audio.init();audio.tone(115,.035,'square',.016,30)}}
    function bindHold(el,side){el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);setFlipper(side,true)});['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();setFlipper(side,false)}))}
    bindHold(ui.left,'left');bindHold(ui.right,'right');ui.launch.addEventListener('pointerdown',e=>{e.preventDefault();launch()});
    addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown','Space'].includes(e.code))e.preventDefault();if(e.repeat&&e.code==='Space')return;if(e.code==='ArrowLeft'){input.left=true;ui.left.classList.add('active')}if(e.code==='ArrowRight'){input.right=true;ui.right.classList.add('active')}if(e.code==='ArrowDown'){input.left=input.right=true;ui.left.classList.add('active');ui.right.classList.add('active')}if(e.code==='Space')launch()},{passive:false});
    addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','ArrowDown','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'){input.left=false;ui.left.classList.remove('active')}if(e.code==='ArrowRight'){input.right=false;ui.right.classList.remove('active')}if(e.code==='ArrowDown'){input.left=input.right=false;ui.left.classList.remove('active');ui.right.classList.remove('active')}},{passive:false});
    ui.sound.addEventListener('click',()=>{prefs.sound=!prefs.sound;storage.set('nebula-sound',prefs.sound);if(prefs.sound)audio.tone(440,.08);updateHUD()});
    document.querySelector('#settingsBtn').addEventListener('click',()=>{updateHUD();ui.settings.showModal()});document.querySelector('#closeSettings').addEventListener('click',()=>ui.settings.close());
    document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{prefs.mode=b.dataset.mode;storage.set('nebula-mode',prefs.mode);input.left=input.right=false;updateHUD()}));document.querySelectorAll('[data-sound]').forEach(b=>b.addEventListener('click',()=>{prefs.sound=b.dataset.sound==='on';storage.set('nebula-sound',prefs.sound);updateHUD()}));
    document.addEventListener('visibilitychange',()=>{last=performance.now();acc=0;input.left=input.right=false});
    updateHUD();resetBall();requestAnimationFrame(loop);
    if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    window.__NEBULA_TEST__={getState:()=>({score,high,balls,multiplier,state,ball:{...ball},mode:prefs.mode,sound:prefs.sound}),launch,newGame,setMode:m=>{prefs.mode=m;storage.set('nebula-mode',m);updateHUD()},step:n=>{for(let i=0;i<n;i++)physics(STEP)}};
  })();
  </script>
</body>
