<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
  <meta name="theme-color" content="#050817">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nebula Strike">
  <title>Nebula Strike — Pinball Arcade</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <style>
    :root{--bg:#030611;--panel:#071128;--cyan:#18ddff;--pink:#ff43d4;--amber:#ffc857;--text:#eaf9ff;--muted:#81a4ba}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;touch-action:none;user-select:none;-webkit-user-select:none}
    body{display:grid;place-items:center;background:radial-gradient(circle at 50% -10%,#132a6a 0,#050817 46%,#02040b 100%)}
    button{font:inherit;color:inherit}
    #app{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto;width:min(100vw,560px);height:100dvh;overflow:hidden;background:#050817;border-inline:1px solid #1d3f66;box-shadow:0 0 80px #0bc9ff20}
    .hud{z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 12px 8px;background:linear-gradient(#081128f5,#050a18f0);border-bottom:1px solid #28547a;box-shadow:0 6px 18px #000b}
    .brand{text-align:center;line-height:.8;font-weight:1000;font-style:italic;letter-spacing:.06em;text-shadow:0 0 10px var(--cyan)}
    .brand b{display:block;color:var(--cyan);font-size:clamp(14px,4vw,22px)}.brand i{display:block;color:var(--pink);font-size:clamp(12px,3.3vw,18px)}
    .readout{min-width:0}.readout.right{text-align:right}.label{display:block;color:var(--amber);font-size:9px;letter-spacing:.14em}.digits{display:block;color:#ffd777;font-weight:900;font-size:clamp(15px,4.5vw,25px);letter-spacing:.05em;text-shadow:0 0 9px #ff9f1c}
    .mini{color:var(--muted);font-size:9px;margin-top:2px;white-space:nowrap}.balls{color:var(--cyan);letter-spacing:2px}
    #stage{position:relative;min-height:0;background:#02040b;overflow:hidden}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    #message{position:absolute;z-index:2;left:50%;top:48%;transform:translate(-50%,-50%);width:min(82%,360px);padding:14px 18px;text-align:center;border:1px solid #38ddff88;background:#03091bd9;box-shadow:0 0 30px #13d8ff33,inset 0 0 20px #132c55;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .2s}
    #message.show{opacity:1}.message-title{font-weight:1000;color:var(--amber);font-size:clamp(18px,5vw,28px);letter-spacing:.09em}.message-sub{margin-top:6px;color:#b9eaff;font-size:12px;line-height:1.45}
    .controls{z-index:4;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#071128,#030711);border-top:1px solid #29506d;box-shadow:0 -8px 22px #000c}
    .flipper-btn,.launch-btn,.icon-btn{position:relative;border:1px solid currentColor;background:linear-gradient(160deg,#0c2443,#050a18);box-shadow:inset 0 0 18px #142e50,0 0 12px currentColor;cursor:pointer;touch-action:none}
    .flipper-btn{height:clamp(58px,11vh,82px);border-radius:50%;font-weight:900;font-size:clamp(12px,3.3vw,17px);letter-spacing:.08em}.flipper-btn.left{color:var(--cyan)}.flipper-btn.right{color:var(--pink)}
    .flipper-btn.active{transform:translateY(2px) scale(.97);background:#143858;filter:brightness(1.45)}
    .center-controls{display:grid;grid-template-columns:34px clamp(62px,17vw,86px) 34px;gap:7px;align-items:center}.launch-btn{aspect-ratio:1;border-radius:50%;color:var(--amber);font-size:11px;font-weight:1000}.launch-btn:active{transform:scale(.95);filter:brightness(1.4)}.icon-btn{width:34px;height:34px;border-radius:50%;color:#aeefff;padding:0;font-size:16px}
    dialog{color:var(--text);width:min(90vw,430px);border:1px solid #2acff0;background:#071128f8;border-radius:14px;box-shadow:0 0 60px #0ad9ff35;padding:0}dialog::backdrop{background:#000b;backdrop-filter:blur(5px)}
    .settings{padding:22px}.settings h2{margin:0 0 18px;color:var(--cyan);font-size:20px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0;border-top:1px solid #173654}.setting-row span small{display:block;color:var(--muted);margin-top:4px;font-size:10px}.choice{display:flex;background:#020713;border:1px solid #29506d;border-radius:8px;padding:2px}.choice button{border:0;background:transparent;padding:8px 10px;border-radius:6px;font-size:11px}.choice button.selected{background:#174365;color:#fff;box-shadow:0 0 10px #13d8ff55}.close{width:100%;margin-top:18px;padding:11px;border:1px solid var(--amber);border-radius:8px;background:#312309;color:#ffdc88;font-weight:900}
    .audio-test{width:100%;padding:10px;border:1px solid var(--cyan);border-radius:8px;background:#08233b;color:#bff7ff;font-weight:900}.audio-result{display:block;min-height:1.3em;margin-top:7px;color:var(--muted);font-size:10px;line-height:1.3;text-align:center}
    .rotate{display:none;position:fixed;inset:0;z-index:20;background:#030611;place-items:center;text-align:center;padding:30px;color:var(--cyan)}
    @media (orientation:landscape) and (max-height:560px) and (pointer:coarse){.rotate{display:grid}}
    @media (min-width:700px){#app{height:min(100dvh,980px);border-radius:18px}.hud{padding-top:10px}.controls{padding-bottom:12px}}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main id="app" aria-label="Nebula Strike ピンボール">
    <header class="hud">
      <div class="readout"><span class="label">SCORE</span><strong id="score" class="digits">0000000</strong><div class="mini">× <span id="multiplier">1</span></div></div>
      <div class="brand"><b>NEBULA</b><i>STRIKE</i></div>
      <div class="readout right"><span class="label">HIGH</span><strong id="high" class="digits">0000000</strong><div class="mini">BALLS <span id="balls" class="balls">●●●</span></div></div>
    </header>
    <section id="stage" aria-label="ピンボール盤面">
      <canvas id="game" width="600" height="960"></canvas>
      <div id="message"><div class="message-title"></div><div class="message-sub"></div></div>
    </section>
    <footer class="controls" id="controls">
      <button class="flipper-btn left" id="leftBtn" aria-label="左フリッパー">LEFT</button>
      <div class="center-controls"><button class="icon-btn" id="soundBtn" aria-label="サウンド切替">♪</button><button class="launch-btn" id="launchBtn">LAUNCH</button><button class="icon-btn" id="settingsBtn" aria-label="設定">⚙</button></div>
      <button class="flipper-btn right" id="rightBtn" aria-label="右フリッパー">RIGHT</button>
    </footer>
  </main>
  <div class="rotate">端末を縦向きにするとプレイできます</div>
  <dialog id="settingsDialog">
    <div class="settings"><h2>GAME SETTINGS</h2>
      <div class="setting-row"><span>タッチ操作<small>片手モードは左右同時に作動</small></span><div class="choice"><button data-mode="one">片手</button><button data-mode="split">左右</button></div></div>
      <div class="setting-row"><span>効果音<small>状態: <b id="audioStatus">未開始</b></small></span><div class="choice"><button data-sound="on">ON</button><button data-sound="off">OFF</button></div></div>
      <div class="setting-row"><span>音量<small>iPhone本体の音量にも連動</small></span><div class="choice"><button data-volume="0.45">小</button><button data-volume="0.75">中</button><button data-volume="1">大</button></div></div>
      <button class="audio-test" id="audioTest">効果音テスト</button><small class="audio-result" id="audioResult">ボタンを押すと音声状態を診断します</small>
      <button class="close" id="closeSettings">プレイに戻る</button>
    </div>
  </dialog>
  <script>
  (()=>{'use strict';
    const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d',{alpha:false});
    const ui={score:document.querySelector('#score'),high:document.querySelector('#high'),balls:document.querySelector('#balls'),multiplier:document.querySelector('#multiplier'),message:document.querySelector('#message'),left:document.querySelector('#leftBtn'),right:document.querySelector('#rightBtn'),launch:document.querySelector('#launchBtn'),sound:document.querySelector('#soundBtn'),settings:document.querySelector('#settingsDialog')};
    const W=600,H=960,STEP=1/120,MAX_FRAME=.05,TAU=Math.PI*2;
    const storage={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
    const prefs={mode:storage.get('nebula-mode','one'),sound:storage.get('nebula-sound',true),volume:storage.get('nebula-volume',.75)};
    let high=storage.get('nebula-high',0),score=0,balls=3,multiplier=1,state='ready',last=performance.now(),acc=0,shake=0,flash=0,idle=0,launchPower=0,combo=0,comboTimer=0,bonusPulse=0,callout='';
    const input={left:false,right:false};
    const ball={x:530,y:820,vx:0,vy:0,r:11,active:false,trail:[]};
    const stars=Array.from({length:85},(_,i)=>({x:(i*137.5)%W,y:(i*83.7)%H,r:.5+(i%3)*.45,a:.22+(i%5)*.1}));
    const bumpers=[{x:215,y:265,r:48,c:'#19dfff',v:350},{x:388,y:270,r:48,c:'#19dfff',v:350},{x:303,y:390,r:52,c:'#ff43d4',v:500}];
    const miniBumpers=[{x:180,y:185,r:26,c:'#13d8ff',v:200,biasX:120,label:'MINI POP'},{x:420,y:185,r:26,c:'#ff43d4',v:200,biasX:-120,label:'MINI POP'}];
    const posts=[{x:115,y:548,r:18},{x:486,y:548,r:18},{x:176,y:650,r:13},{x:424,y:650,r:13},{x:300,y:538,r:19}];
    const targets=[{x:250,y:486,w:28,h:50,down:0},{x:286,y:486,w:28,h:50,down:0},{x:322,y:486,w:28,h:50,down:0}];
    const standups=[{x:112,y:300,w:22,h:44,lit:0,c:'#13d8ff'},{x:466,y:300,w:22,h:44,lit:0,c:'#ff43d4'}];
    const kickers=[{x:150,y:400,r:19,c:'#ffc857',v:430,cooldown:0,label:'KICKER'},{x:450,y:400,r:19,c:'#ffc857',v:430,cooldown:0,label:'KICKER'}];
    const bonusLamps=[{x:165,y:472,r:15,on:0,c:'#13d8ff'},{x:435,y:472,r:15,on:0,c:'#ff43d4'}];
    const laneRails=[
      {segments:[[97,198,98,300],[98,300,100,410],[100,410,103,520]],c:'#13d8ff'},
      {segments:[[497,198,497,300],[497,300,497,410],[497,410,497,520]],c:'#ff43d4'}
    ];
    const launchGate={x:502,y:204,len:38,open:0,hold:0,hit:0};
    const slingshots=[
      {side:'left',points:[[103,520],[140,714],[168,754]],face:[121,553,160,688],cooldown:0,c:'#13d8ff'},
      {side:'right',points:[[497,520],[460,714],[432,754]],face:[479,553,440,688],cooldown:0,c:'#ff43d4'}
    ];
    const lowerGuides=[
      {segments:[[140,714,158,770],[158,770,146,780]],c:'#13d8ff'},
      {segments:[[460,714,442,770],[442,770,454,780]],c:'#ff43d4'}
    ];
    const rollovers=[{x:210,y:172,r:13,on:0},{x:300,y:160,r:13,on:0},{x:390,y:172,r:13,on:0}];
    const spinner={x:300,y:220,r:22,a:0,speed:0,cooldown:0};
    // Angles are absolute canvas angles. No side multiplier is used: this avoids
    // double-mirroring the right flipper and keeps rendering/physics identical.
    const flippers=[
      {side:'left',px:166,py:808,len:112,baseR:22,tipR:12,rest:.29,up:-.48,a:.29,omega:0},
      {side:'right',px:434,py:808,len:112,baseR:22,tipR:12,rest:Math.PI-.29,up:Math.PI+.48,a:Math.PI-.29,omega:0}
    ];
    const walls=[
      [52,830,42,190],[42,190,95,105],[95,105,470,105],[470,105,552,188],[552,188,552,855],
      [52,830,150,900],[150,900,252,900],[348,900,450,900],[450,900,552,830]
    ];
    const audio={ctx:null,master:null,unlocking:null,lastError:'',
      ensure(){if(this.ctx)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC){this.lastError='Web Audio非対応';return false}try{this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=prefs.volume;this.master.connect(this.ctx.destination);this.ctx.onstatechange=()=>updateHUD();return true}catch(e){this.lastError=e?.message||'AudioContext作成失敗';return false}},
      status(){return !this.ctx?(this.lastError||'未開始'):this.ctx.state==='running'?'再生可能':this.ctx.state==='suspended'?'一時停止中':this.ctx.state},
      async unlock(){if(!this.ensure())return false;if(this.ctx.state==='running'){this.lastError='';updateHUD();return true}if(!this.unlocking){try{const b=this.ctx.createBuffer(1,1,this.ctx.sampleRate),s=this.ctx.createBufferSource();s.buffer=b;s.connect(this.master);s.start(0)}catch(e){this.lastError=e?.message||'無音バッファ開始失敗'}this.unlocking=this.ctx.resume().then(()=>{const ok=this.ctx.state==='running';this.lastError=ok?'':'resume後も'+this.ctx.state;return ok}).catch(e=>{this.lastError=e?.message||'resume失敗';return false}).finally(()=>{this.unlocking=null;updateHUD()})}return this.unlocking},
      setVolume(v){prefs.volume=v;if(this.master)this.master.gain.setValueAtTime(v,this.ctx.currentTime)},
      tone(f=280,d=.07,type='sine',vol=.07,slide=0){if(!prefs.sound||!this.ensure())return;const play=()=>{try{const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);g.gain.setValueAtTime(Math.max(.001,vol),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(this.master);o.start(t);o.stop(t+d)}catch(e){this.lastError=e?.message||'再生失敗';updateHUD()}};if(this.ctx.state==='running')play();else this.unlock().then(ok=>{if(ok&&prefs.sound)play()})},
      async test(){this.lastError='';if(!prefs.sound){this.lastError='効果音がOFFです';updateHUD();return false}if(!this.ensure())return false;try{const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='square';o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(880,t+.16);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22*Math.max(.45,prefs.volume),t+.02);g.gain.setValueAtTime(.22*Math.max(.45,prefs.volume),t+.27);g.gain.exponentialRampToValueAtTime(.0001,t+.38);o.connect(g).connect(this.ctx.destination);o.start(t);o.stop(t+.4);const ok=await this.unlock();if(!ok)throw new Error(this.lastError||'AudioContextを開始できません');return true}catch(e){this.lastError=e?.message||'テスト音再生失敗';updateHUD();return false}}
    };
    function updateHUD(){ui.score.textContent=String(score).padStart(7,'0');ui.high.textContent=String(high).padStart(7,'0');ui.balls.textContent='●'.repeat(balls)+'○'.repeat(3-balls);ui.multiplier.textContent=multiplier;ui.sound.textContent=prefs.sound?'♪':'×';const status=document.querySelector('#audioStatus');if(status)status.textContent=prefs.sound?audio.status():'OFF';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('selected',b.dataset.mode===prefs.mode));document.querySelectorAll('[data-sound]').forEach(b=>b.classList.toggle('selected',(b.dataset.sound==='on')===prefs.sound));document.querySelectorAll('[data-volume]').forEach(b=>b.classList.toggle('selected',Math.abs(Number(b.dataset.volume)-prefs.volume)<.01))}
    function message(title,sub='',ms=0){ui.message.querySelector('.message-title').textContent=title;ui.message.querySelector('.message-sub').textContent=sub;ui.message.classList.add('show');if(ms)setTimeout(()=>ui.message.classList.remove('show'),ms)}
    function addScore(n){score+=n*multiplier;if(score>high){high=score;storage.set('nebula-high',high)}updateHUD()}
    function scoreHit(base,label){combo=comboTimer>0?Math.min(8,combo+1):1;comboTimer=2.1;const extra=combo>1?combo*25:0;addScore(base+extra);if(combo>=3){callout=`${combo} HIT COMBO +${extra}`;bonusPulse=.75;if(combo===3||combo===6)audio.tone(880,.13,'square',.07,360)}else if(label){callout=label;bonusPulse=.28}}
    function resetBall(){ball.x=530;ball.y=820;ball.vx=0;ball.vy=0;ball.active=false;ball.trail.length=0;launchGate.open=0;launchGate.hold=0;idle=0;state='ready';message(balls===3&&score===0?'READY':'BALL '+(4-balls),'SPACE / LAUNCH で発射',1400)}
    function newGame(){score=0;balls=3;multiplier=1;combo=0;comboTimer=0;targets.forEach(t=>t.down=0);standups.forEach(t=>t.lit=0);rollovers.forEach(r=>r.on=0);bonusLamps.forEach(l=>l.on=0);resetBall();updateHUD()}
    function launch(){audio.unlock();if(state==='gameover'){newGame();return}if(!ball.active){ball.active=true;state='playing';ball.vx=-38+(Math.random()-.5)*70;ball.vy=-950-Math.random()*80-launchPower;launchPower=0;ui.message.classList.remove('show');audio.tone(130,.2,'sawtooth',.09,500)}}
    function loseBall(){if(state!=='playing')return;ball.active=false;balls--;audio.tone(180,.5,'sawtooth',.05,-120);updateHUD();if(balls<=0){state='gameover';message('GAME OVER','SCORE '+score.toLocaleString()+' — LAUNCHでリスタート');storage.set('nebula-high',high)}else{setTimeout(resetBall,700)}}
    function closestPoint(ax,ay,bx,by,px,py){const dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1)));return{x:ax+dx*t,y:ay+dy*t,t}}
    function collideSegment(ax,ay,bx,by,restitution=.82,kick=0,railR=3){const q=closestPoint(ax,ay,bx,by,ball.x,ball.y),dx=ball.x-q.x,dy=ball.y-q.y,d=Math.hypot(dx,dy),min=ball.r+railR;if(d>=min||d===0)return false;const nx=dx/d,ny=dy/d,rel=ball.vx*nx+ball.vy*ny;if(rel<0){ball.x+=nx*(min-d+.3);ball.y+=ny*(min-d+.3);ball.vx-=nx*(1+restitution)*rel;ball.vy-=ny*(1+restitution)*rel;if(kick){ball.vx+=nx*kick;ball.vy+=ny*kick}return true}return false}
    function collideCircle(o,bonus=0){const dx=ball.x-o.x,dy=ball.y-o.y,d=Math.hypot(dx,dy),min=ball.r+o.r;if(d>=min||d===0)return false;const nx=dx/d,ny=dy/d,rel=ball.vx*nx+ball.vy*ny;ball.x+=nx*(min-d+.5);ball.y+=ny*(min-d+.5);if(rel<0){ball.vx-=nx*1.88*rel;ball.vy-=ny*1.88*rel;if(o.v&&!o.cooldown){ball.vx+=nx*o.v+(o.biasX||0);ball.vy+=ny*o.v;scoreHit(bonus,o.label||'BUMPER');if('cooldown'in o)o.cooldown=.3;flash=.18;shake=o.label==='KICKER'?7:5;audio.tone(o.c==='#ff43d4'?520:o.label==='KICKER'?340:690,.09,'square',.05,o.label==='KICKER'?420:180)}}return true}
    function gatePhysics(dt){launchGate.hit=Math.max(0,launchGate.hit-dt);if(!ball.active){launchGate.open+=(0-launchGate.open)*Math.min(1,dt*18);return}const inLane=ball.x>500&&ball.x<548,fromBelow=inLane&&ball.y>launchGate.y&&ball.y<launchGate.y+80&&ball.vy<0;if(fromBelow)launchGate.hold=.28;else launchGate.hold=Math.max(0,launchGate.hold-dt);if(inLane&&ball.vy>0&&ball.y>launchGate.y-65&&ball.y<launchGate.y+ball.r+5){launchGate.hold=0;launchGate.open=0;if(collideSegment(launchGate.x,launchGate.y,launchGate.x+launchGate.len,launchGate.y,.88,0,3)){launchGate.hit=.16;audio.tone(430,.045,'square',.035,90)}}else{const target=launchGate.hold>0?1:0;launchGate.open+=(target-launchGate.open)*Math.min(1,dt*(target?28:15))}}
    function flipperGeometry(f){const ex=f.px+Math.cos(f.a)*f.len,ey=f.py+Math.sin(f.a)*f.len,nx=-Math.sin(f.a),ny=Math.cos(f.a);return{ex,ey,nx,ny,points:[[f.px+nx*f.baseR,f.py+ny*f.baseR],[ex+nx*f.tipR,ey+ny*f.tipR],[ex-nx*f.tipR,ey-ny*f.tipR],[f.px-nx*f.baseR,f.py-ny*f.baseR]]}}
    function flipperPhysics(f,pressed,dt){const target=pressed?f.up:f.rest,prev=f.a,diff=target-f.a;f.a+=diff*Math.min(1,dt*(pressed?34:19));f.omega=(f.a-prev)/dt;const g=flipperGeometry(f),q=closestPoint(f.px,f.py,g.ex,g.ey,ball.x,ball.y),dx=ball.x-q.x,dy=ball.y-q.y,d=Math.hypot(dx,dy),surfaceR=f.baseR+(f.tipR-f.baseR)*q.t,min=ball.r+surfaceR;if(ball.active&&d<min&&d>0){const nx=dx/d,ny=dy/d,rx=q.x-f.px,ry=q.y-f.py,sx=-f.omega*ry,sy=f.omega*rx,rv=(ball.vx-sx)*nx+(ball.vy-sy)*ny;ball.x+=nx*(min-d+.7);ball.y+=ny*(min-d+.7);if(rv<70){ball.vx-=nx*(1.75*rv);ball.vy-=ny*(1.75*rv);if(pressed&&Math.abs(f.omega)>.25){ball.vx+=sx*.72;ball.vy+=sy*.72-120}audio.tone(190,.05,'square',.055,90)}}}
    function physics(dt){
      flippers.forEach(f=>flipperPhysics(f,input[f.side],dt));
